{% extends "base.html" %}

{% block content %}
  <div class="jumbotron">
    <h1 class="display-4">Metascore</h1>
    <p class="lead">Ratings and reviews of movies and video games from our critics.</p>
  </div>

  <div class="row text-center">
    <div class="col-6 col-md-3 mb-3">
      <div class="card">
        <div class="card-body">
          <p class="h2 mb-0">{{ num_titles }}</p>
          <p class="text-muted mb-0">titles</p>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3 mb-3">
      <div class="card">
        <div class="card-body">
          <p class="h2 mb-0">{{ num_movies }}</p>
          <p class="text-muted mb-0">movies</p>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3 mb-3">
      <div class="card">
        <div class="card-body">
          <p class="h2 mb-0">{{ num_games }}</p>
          <p class="text-muted mb-0">games</p>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3 mb-3">
      <div class="card">
        <div class="card-body">
          <p class="h2 mb-0">{{ num_reviews }}</p>
          <p class="text-muted mb-0">reviews</p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
