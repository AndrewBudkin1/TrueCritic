{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{% if object %}Edit {{ object }}{% else %}Add new{% endif %} | Metascore{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="h3 mb-4">
        {% if object %}Edit {{ object }}{% else %}Add new{% endif %}
      </h1>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{{ cancel_url }}{% endif %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
